  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #0f141c;
      user-select: none;
    }
    .font-display {
      font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
    }
    
    /* 16:9 播放器響應式容器 */
    .aspect-video-box {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
    }

    /* 投影片轉場樣式 */
    .slide-wrapper {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: opacity, transform;
    }

    .slide-wrapper.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0) scale(1);
      z-index: 10;
    }

    /* 轉場動畫定義 */
    .transition-fade.slide-out-prev {
      opacity: 0;
      transform: scale(0.98);
    }
    .transition-slide-left.slide-in-next {
      transform: translateX(60px);
    }
    .transition-slide-left.slide-out-prev {
      transform: translateX(-60px);
      opacity: 0;
    }
    .transition-zoom.slide-in-next {
      transform: scale(1.08);
      opacity: 0;
    }
    .transition-zoom.slide-out-prev {
      transform: scale(0.92);
      opacity: 0;
    }

    /* 逐段文字與元素進場動畫 */
    .anim-elem {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .anim-visible {
      opacity: 1 !important;
      transform: translateY(0) scale(1) !important;
    }

    /* 柔和文字陰影，確保在任何亮色插圖背景上極其清晰 */
    .text-glow {
      text-shadow: 0 2px 14px rgba(255, 255, 255, 0.9), 0 0 4px rgba(255, 255, 255, 0.8);
    }
    .badge-shadow {
      box-shadow: 0 8px 24px -4px rgba(30, 41, 59, 0.08), 0 4px 10px rgba(0, 0, 0, 0.03);
    }

    /* 自定義捲軸 */
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
  </style>
</head>

          <svg class="w-12 h-12 text-rose-500 drop-shadow-md" viewBox="0 0 64 64" fill="none">
            <path d="M32 50S16 38 16 26A10 10 0 0132 18A10 10 0 0148 26C48 38 32 50 32 50Z" fill="#FECDD3" fill-opacity="0.4" stroke="#E11D48" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="28" cy="27" r="2" fill="#BE123C"/>

            <path d="M29 32Q32 35 35 32" stroke="#BE123C" stroke-width="2" stroke-linecap="round"/>

      },
      {
        id: "slide_06",
        slideNum: 6,
        title: "我開始分享\n自己的眼光",
        highlightTag: "勇氣跨越 06",
        bulletPoints: [

        narration: "我也曾羨慕別人的自信，怕照片太奇怪而不敢分享。後來，同學邀我拍班級活動，我答應了，卻拖了兩天才敢放進班群。看到大家說我拍到他們沒注意的表情，我才鬆口氣。原來想得多，也能讓我多看見一些事情。",
        segments: [
          { text: "我也曾羨慕別人的自信，", duration: 2.4 },
          { text: "怕照片太奇怪而不敢分享。", duration: 2.6 },
          { text: "後來，同學邀我拍班級活動，我答應了，", duration: 3.6 },
          { text: "卻拖了兩天才敢放進班群。", duration: 2.6 },
          { text: "看到大家說我拍到他們沒注意的表情，我才鬆口氣。", duration: 4.4 },
          { text: "原來想得多，也能讓我多看見一些事情。", duration: 3.6 }
        ],
        sceneImage: "第6張.jpg",
        transition: "transition-slide-left",
        accentColor: "from-sky-500 to-blue-600",
        svgIcon: `
          <svg class="w-12 h-12 text-sky-500 drop-shadow-md" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="20" stroke="#0284C7" stroke-width="3"/>
            <circle cx="32" cy="32" r="8" fill="#BAE6FD" fill-opacity="0.5" stroke="#0369A1" stroke-width="3"/>
            <path d="M12 32C18 20 46 20 52 32C46 44 18 44 12 32Z" stroke="#0284C7" stroke-width="2.5"/>
            <circle cx="35" cy="29" r="2" fill="white"/>
          </svg>
        `
      },
      {
        id: "slide_07",
        slideNum: 7,
        title: "我想帶著自己的\n步調往前走",
        highlightTag: "願景未來 07",
        bulletPoints: [
          "我想把校園角落整理成影像日記",
          "我想練習提早說出還不完整的想法",
          "我願意把眼中的世界分享給別人"
        ],
        narration: "接下來，我想把校園角落整理成影像日記，也練習在討論時，提早說出還不完整的想法。我想保留觀察、傾聽和反覆嘗試的習慣，同時多往前走一步。這些普通的特點組成了我，我願意把眼中的世界分享給別人。",
        segments: [
          { text: "接下來，我想把校園角落整理成影像日記，", duration: 3.6 },
          { text: "也練習在討論時，提早說出還不完整的想法。", duration: 4.0 },
          { text: "我想保留觀察、傾聽和反覆嘗試的習慣，", duration: 3.8 },
          { text: "同時多往前走一步。", duration: 2.2 },
          { text: "這些普通的特點組成了我，", duration: 2.6 },
          { text: "我願意把眼中的世界分享給別人。", duration: 3.2 }
        ],
        sceneImage: "第7張.jpg",
        transition: "transition-fade",
        accentColor: "from-amber-500 to-orange-500",
        svgIcon: `
          <svg class="w-12 h-12 text-amber-500 drop-shadow-md" viewBox="0 0 64 64" fill="none">
            <path d="M18 16H46V48L32 40L18 48V16Z" fill="#FDE68A" fill-opacity="0.4" stroke="#D97706" stroke-width="3" stroke-linejoin="round"/>
            <path d="M26 26L38 26" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M26 32L34 32" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="48" cy="16" r="4" fill="#F59E0B"/>
          </svg>
        `
      }
    ];

    // 播放器狀態機
    const state = {
      currentIndex: 0,
      isPlaying: false,
      isSubtitleEnabled: true,
      currentSegmentIndex: 0,
      speechVoice: null,
      speechUtterance: null,
      slideTimer: null,
      segmentTimer: null,
      isSpeechSupported: 'speechSynthesis' in window,
      totalDurationSec: SLIDES_DATA.reduce((acc, s) => acc + s.segments.reduce((a, b) => a + b.duration, 0), 0)
    };

    // DOM 元素引用
    const viewport = document.getElementById('slides-viewport');
    const btnPlayPause = document.getElementById('btn-play-pause');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    const btnReplay = document.getElementById('btn-replay');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnCC = document.getElementById('btn-cc');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const iconFs = document.getElementById('icon-fs');
    const iconExitFs = document.getElementById('icon-exit-fs');
    const slideIndicator = document.getElementById('slide-indicator');
    const timelineProgress = document.getElementById('timeline-progress');
    const timelineBar = document.getElementById('timeline-bar');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    const subtitleBox = document.getElementById('subtitle-box');
    const subtitleText = document.getElementById('subtitle-text');
    const startOverlay = document.getElementById('start-overlay');
    const voiceIndicator = document.getElementById('voice-indicator');
    const thumbnailsTrack = document.getElementById('thumbnails-track');

    /**
     * 1. 初始化頁面投影片 DOM
     * 左側放置加大放寬的高質感視覺資訊卡片，完全不遮擋右半邊人物插圖本體
     */
    function initSlidesDOM() {
      viewport.innerHTML = '';
      SLIDES_DATA.forEach((slide, index) => {
        const slideEl = document.createElement('div');
        slideEl.id = `slide-${index}`;
        slideEl.className = `slide-wrapper ${slide.transition} ${index === 0 ? 'active' : ''}`;
        
        // 背景圖片依上傳圖檔設定，絕不覆蓋任何全螢幕半透明遮罩
        slideEl.style.backgroundImage = `url('${slide.sceneImage}')`;
        slideEl.style.backgroundSize = 'cover';
        slideEl.style.backgroundPosition = 'center right';

        // 格式化標題換行
        const formattedTitle = slide.title.replace(/\n/g, '<br/>');

        // 左半部文字卡片與 SVG 裝飾 (自然融入原本留白區)
        slideEl.innerHTML = `
          <!-- 輕柔左側專屬微漸層，強化文字閱讀性同時完全保證右側畫面清透純淨 -->
          <div class="absolute inset-y-0 left-0 w-3/5 bg-gradient-to-r from-white/95 via-white/80 to-transparent pointer-events-none"></div>

          <!-- 左側核心視覺看板 -->
          <div class="relative z-10 w-full h-full flex flex-col justify-between p-6 sm:p-10 md:p-12 lg:p-16 max-w-[55%]">
            
            <!-- 上部：標籤徽章與 SVG 主題識別 -->
            <div class="flex items-center space-x-3 anim-elem" data-delay="100">
              <div class="p-2.5 rounded-2xl bg-white/90 backdrop-blur-md badge-shadow border border-slate-200/80">
                ${slide.svgIcon}
              </div>
              <div>
                <span class="inline-block text-xs md:text-sm font-black tracking-widest uppercase bg-gradient-to-r ${slide.accentColor} bg-clip-text text-transparent">
                  ${slide.highlightTag}
                </span>
                <p class="text-xs text-slate-500 font-medium">我的特質探索日記 • SLIDE ${slide.slideNum}</p>
              </div>
            </div>

            <!-- 中部：加大加粗的主標題與視覺重點 -->
            <div class="my-auto space-y-4 md:space-y-6">
              <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-[54px] font-black leading-tight text-slate-900 tracking-tight font-display anim-elem text-glow" data-delay="300">
                ${formattedTitle}
              </h1>
              
              <!-- 重點條目 (依序顯現動畫) -->
              <div class="space-y-3 pt-2">
                ${slide.bulletPoints.map((point, ptIdx) => `
                  <div class="anim-elem flex items-start space-x-3 bg-white/85 backdrop-blur-md p-3 sm:p-3.5 rounded-xl border border-amber-200/70 shadow-sm" data-delay="${500 + ptIdx * 250}">
                    <span class="mt-1 flex-shrink-0 w-5 h-5 rounded-full bg-amber-400 text-slate-900 flex items-center justify-center font-bold text-xs shadow-sm">
                      ✓
                    </span>
                    <span class="text-base sm:text-lg md:text-xl font-bold text-slate-800 leading-snug">
                      ${point}
                    </span>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- 下部：互動小提示與進度標記 -->
            <div class="flex items-center space-x-2 text-xs md:text-sm text-slate-500 font-semibold anim-elem" data-delay="900">
              <span class="w-2 h-2 rounded-full bg-amber-500"></span>
              <span>觀察 • 傾聽 • 嘗試 • 陪伴</span>
            </div>

          </div>
        `;
        viewport.appendChild(slideEl);
      });

      // 初始化下方縮圖
      initThumbnails();
      timeTotal.textContent = formatTime(state.totalDurationSec);
    }

    /**
     * 2. 建立底部導覽縮圖
     */
    function initThumbnails() {
      thumbnailsTrack.innerHTML = '';
      SLIDES_DATA.forEach((s, idx) => {
        const thumb = document.createElement('button');
        thumb.className = `group relative rounded-lg overflow-hidden border-2 aspect-video transition-all transform hover:scale-105 ${idx === 0 ? 'border-amber-400 ring-2 ring-amber-400/50' : 'border-slate-800 opacity-60 hover:opacity-100'}`;
        thumb.id = `thumb-${idx}`;
        thumb.innerHTML = `
          <img src="${s.sceneImage}" alt="投影片 ${idx + 1}" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-slate-900/40 group-hover:bg-transparent transition"></div>
          <span class="absolute bottom-1 right-1.5 text-[10px] font-bold px-1 rounded bg-black/70 text-white">0${idx + 1}</span>
        `;
        thumb.addEventListener('click', () => {
          goToSlide(idx);
          if (!state.isPlaying) play();
        });
        thumbnailsTrack.appendChild(thumb);
      });
    }

    /**
     * 3. 語音配音設定 (Web Speech Synthesis)
     * 針對需求：優先選取 "Microsoft Zhiwei"，語速設為 1.2 倍
     */
    function setupVoiceEngine() {
      if (!state.isSpeechSupported) {
        voiceIndicator.innerHTML = `<span class="text-rose-400">瀏覽器不支援語音合成</span>`;
        return;
      }

      function pickTargetVoice() {
        const voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) return;

        // 1. 優先尋找 Microsoft Zhiwei (臺灣男性中文)
        let foundVoice = voices.find(v => v.name.includes("Zhiwei") || v.name.includes("志偉"));

        // 2. 次要尋找中文 (臺灣) 男性或自然語音
        if (!foundVoice) {
          foundVoice = voices.find(v => (v.lang === 'zh-TW' || v.lang === 'zh_TW') && (v.name.includes('Male') || v.name.includes('男')));
        }

        // 3. 再次尋找任何 zh-TW 語音
        if (!foundVoice) {
          foundVoice = voices.find(v => v.lang === 'zh-TW' || v.lang === 'zh_TW');
        }

        // 4. 再次尋找任何中文語音 (zh-CN / zh-HK 等)
        if (!foundVoice) {
          foundVoice = voices.find(v => v.lang.startsWith('zh'));
        }

        state.speechVoice = foundVoice || voices[0];
        
        const voiceLabel = state.speechVoice?.name.includes('Zhiwei') ? 'Microsoft Zhiwei (男聲)' : (state.speechVoice?.name || '標準中文');
        voiceIndicator.innerHTML = `
          <svg class="w-3.5 h-3.5 text-emerald-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
          <span class="text-slate-200">配音：${voiceLabel} (1.2x)</span>
        `;
      }

      pickTargetVoice();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = pickTargetVoice;
      }
    }

    /**
     * 觸發單頁內部元素動畫序列
     */
    function triggerSlideAnimations(slideIndex) {
      const slideEl = document.getElementById(`slide-${slideIndex}`);
      if (!slideEl) return;

      const animElements = slideEl.querySelectorAll('.anim-elem');
      animElements.forEach(el => {
        el.classList.remove('anim-visible');
        const delay = parseInt(el.getAttribute('data-delay') || '100', 10);
        setTimeout(() => {
          if (state.currentIndex === slideIndex) {
            el.classList.add('anim-visible');
          }
        }, delay);
      });
    }

    /**
     * 4. 播放單段語音旁白與精準字幕對位
     */
    function playSlideSpeechAndSubtitles(slideIndex) {
      clearTimers();
      window.speechSynthesis.cancel();

      const slide = SLIDES_DATA[slideIndex];
      state.currentSegmentIndex = 0;

      // 逐步呈現字幕與語音導讀
      function playSegment(segIdx) {
        if (!state.isPlaying || state.currentIndex !== slideIndex) return;

        if (segIdx >= slide.segments.length) {
          // 本頁播放完畢，緩衝 1.2 秒後自動轉跳下一頁
          state.slideTimer = setTimeout(() => {
            if (state.currentIndex < SLIDES_DATA.length - 1) {
              goToSlide(state.currentIndex + 1);
            } else {
              // 影片結束
              pause();
              showSubtitle("簡報影片播放完畢，感謝聆聽！");
            }
          }, 1200);
          return;
        }

        const seg = slide.segments[segIdx];
        state.currentSegmentIndex = segIdx;

        // 更新字幕文字
        showSubtitle(seg.text);

        // 建立語音朗讀實例 (中等偏快 1.2 倍語速)
        if (state.isSpeechSupported) {
          const utter = new SpeechSynthesisUtterance(seg.text);
          utter.rate = 1.2; // 依要求設定為 1.2 倍語速
          utter.pitch = 1.0;
          if (state.speechVoice) {
            utter.voice = state.speechVoice;
          }

          utter.onend = () => {
            // 語句結束時前進至下一段
            playSegment(segIdx + 1);
          };

          utter.onerror = () => {
            // 如遇錯誤以計時器備援
            state.segmentTimer = setTimeout(() => {
              playSegment(segIdx + 1);
            }, (seg.duration * 1000) / 1.2);
          };

          window.speechSynthesis.speak(utter);
        } else {
          // 備援純計時模式
          state.segmentTimer = setTimeout(() => {
            playSegment(segIdx + 1);
          }, (seg.duration * 1000) / 1.2);
        }
      }

      playSegment(0);
    }

    /**
     * 顯示底部字幕氣泡
     */
    function showSubtitle(text) {
      if (!state.isSubtitleEnabled) {
        subtitleBox.classList.add('opacity-0', 'scale-95');
        return;
      }
      subtitleText.textContent = text;
      subtitleBox.classList.remove('opacity-0', 'scale-95');
      subtitleBox.classList.add('opacity-100', 'scale-100');
    }

    /**
     * 切換投影片 (具轉場特效)
     */
    function goToSlide(targetIndex) {
      if (targetIndex < 0 || targetIndex >= SLIDES_DATA.length) return;

      const prevIndex = state.currentIndex;
      const prevSlide = document.getElementById(`slide-${prevIndex}`);
      const nextSlide = document.getElementById(`slide-${targetIndex}`);

      // 移除前一張 active
      if (prevSlide && prevIndex !== targetIndex) {
        prevSlide.classList.remove('active');
        prevSlide.classList.add('slide-out-prev');
        setTimeout(() => {
          prevSlide.classList.remove('slide-out-prev');
        }, 700);
      }

      state.currentIndex = targetIndex;
      nextSlide.classList.add('active');

      // 更新進度與指標
      slideIndicator.textContent = `${targetIndex + 1} / ${SLIDES_DATA.length}`;
      updateProgressDisplay();

      // 更新縮圖外框
      SLIDES_DATA.forEach((_, idx) => {
        const thumb = document.getElementById(`thumb-${idx}`);
        if (thumb) {
          if (idx === targetIndex) {
            thumb.className = "group relative rounded-lg overflow-hidden border-2 aspect-video transition-all transform scale-105 border-amber-400 ring-2 ring-amber-400/50 opacity-100 z-10";
          } else {
            thumb.className = "group relative rounded-lg overflow-hidden border-2 aspect-video transition-all border-slate-800 opacity-60 hover:opacity-100";
          }
        }
      });

      // 觸發文字與 SVG 進場動態
      triggerSlideAnimations(targetIndex);

      // 如果正在播放，啟動旁白與同步字幕
      if (state.isPlaying) {
        playSlideSpeechAndSubtitles(targetIndex);
      } else {
        showSubtitle(SLIDES_DATA[targetIndex].segments[0].text);
      }
    }

    /**
     * 清理所有計時器
     */
    function clearTimers() {
      if (state.slideTimer) clearTimeout(state.slideTimer);
      if (state.segmentTimer) clearTimeout(state.segmentTimer);
    }

    /**
     * 播放控制
     */
    function play() {
      state.isPlaying = true;
      iconPlay.classList.add('hidden');
      iconPause.classList.remove('hidden');
      startOverlay.classList.add('opacity-0', 'pointer-events-none');
      playSlideSpeechAndSubtitles(state.currentIndex);
    }

    function pause() {
      state.isPlaying = false;
      iconPlay.classList.remove('hidden');
      iconPause.classList.add('hidden');
      clearTimers();
      window.speechSynthesis.cancel();
    }

    function togglePlay() {
      if (state.isPlaying) {
        pause();
      } else {
        play();
      }
    }

    /**
     * 更新播放時間與進度條
     */
    function updateProgressDisplay() {
      // 累計先前各頁秒數
      let elapsed = 0;
      for (let i = 0; i < state.currentIndex; i++) {
        elapsed += SLIDES_DATA[i].segments.reduce((a, b) => a + b.duration, 0);
      }
      const percent = (elapsed / state.totalDurationSec) * 100;
      timelineProgress.style.width = `${Math.min(percent, 100)}%`;
      timeCurrent.textContent = formatTime(elapsed);
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    /**
     * 時間軸點擊跳頁
     */
    timelineBar.addEventListener('click', (e) => {
      const rect = timelineBar.getBoundingClientRect();
      const clickRatio = (e.clientX - rect.left) / rect.width;
      const targetSec = clickRatio * state.totalDurationSec;
      
      let runningSec = 0;
      for (let i = 0; i < SLIDES_DATA.length; i++) {
        const slideSec = SLIDES_DATA[i].segments.reduce((a, b) => a + b.duration, 0);
        if (targetSec <= runningSec + slideSec || i === SLIDES_DATA.length - 1) {
          goToSlide(i);
          if (state.isPlaying) play();
          break;
        }
        runningSec += slideSec;
      }
    });

    /**
     * 按鈕與鍵盤事件綁定
     */
    btnPlayPause.addEventListener('click', togglePlay);
    startOverlay.addEventListener('click', () => {
      goToSlide(0);
      play();
    });

    btnReplay.addEventListener('click', () => {
      goToSlide(state.currentIndex);
      if (state.isPlaying) playSlideSpeechAndSubtitles(state.currentIndex);
    });

    btnPrev.addEventListener('click', () => {
      if (state.currentIndex > 0) goToSlide(state.currentIndex - 1);
    });

    btnNext.addEventListener('click', () => {
      if (state.currentIndex < SLIDES_DATA.length - 1) goToSlide(state.currentIndex + 1);
    });

    btnCC.addEventListener('click', () => {
      state.isSubtitleEnabled = !state.isSubtitleEnabled;
      btnCC.classList.toggle('bg-amber-400/20');
      btnCC.classList.toggle('text-amber-300');
      btnCC.classList.toggle('border-amber-400/80');
      btnCC.classList.toggle('bg-slate-800');
      btnCC.classList.toggle('text-slate-400');
      btnCC.classList.toggle('border-slate-700');
      
      if (!state.isSubtitleEnabled) {
        subtitleBox.classList.add('opacity-0');
      } else {
        subtitleBox.classList.remove('opacity-0');
      }
    });

    // 全螢幕切換
    btnFullscreen.addEventListener('click', () => {
      const container = document.querySelector('main');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(() => {});
        iconFs.classList.add('hidden');
        iconExitFs.classList.remove('hidden');
      } else {
        document.exitFullscreen().catch(() => {});
        iconFs.classList.remove('hidden');
        iconExitFs.classList.add('hidden');
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        iconFs.classList.remove('hidden');
        iconExitFs.classList.add('hidden');
      }
    });

    // 鍵盤輔助操控
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowRight') {
        if (state.currentIndex < SLIDES_DATA.length - 1) goToSlide(state.currentIndex + 1);
      } else if (e.code === 'ArrowLeft') {
        if (state.currentIndex > 0) goToSlide(state.currentIndex - 1);
      }
    });

    // 啟動流程
    window.onload = () => {
      initSlidesDOM();
      setupVoiceEngine();
      triggerSlideAnimations(0);
    };
  </script>
